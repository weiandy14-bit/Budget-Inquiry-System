# Budget Inquiry System Workflow Domain Model Schema Change

## Action

Follow the domain-model-schema-change workflow:
1. Edit or create files in src/domain/ (e.g., types.ts, seed.ts, systems.ts, bigSystems.ts)
2. Update any related calculation or validation logic in src/engine/
3. Update UI components to reflect new/changed data (src/ui/...)
4. Update store logic if state shape changes (src/store/useAppStore.ts)
5. Add or update tests (src/engine/*.test.ts)
6. Ensure all tests pass

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/domain/types.ts, src/domain/seed.ts, src/domain/systems.ts

