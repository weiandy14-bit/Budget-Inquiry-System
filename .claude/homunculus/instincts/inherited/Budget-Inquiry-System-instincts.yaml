# Budget Inquiry System Workflow Add Or Refactor Domain Model

## Action

Follow the add-or-refactor-domain-model workflow:
1. Create or modify domain model file(s) (e.g., domain/bigSystems.ts, domain/systems.ts)
2. Update type definitions (domain/types.ts)
3. Update seed data (domain/seed.ts)
4. Update store logic/state (store/useAppStore.ts)
5. Update UI components and logic to use new/refactored model (ui/tabs/*, ui/MainApp.tsx, ui/useCalc.ts)
6. Update or add tests if business logic is affected (engine/checks.test.ts)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/domain/bigSystems.ts, src/domain/systems.ts, src/domain/types.ts

