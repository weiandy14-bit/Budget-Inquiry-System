# Budget Inquiry System Workflow Feature Module Development

## Action

Follow the feature-module-development workflow:
1. Create or update domain model files (e.g., types, seed data, logic).
2. Update or add UI components and tabs to reflect the new feature.
3. Modify state management/store files to support the new feature.
4. Update calculation or utility logic if necessary.
5. Add or update tests for the new logic.
6. Update styles and theme as needed.
7. Update documentation (README.md) if user-facing changes are made.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/domain/*.ts, src/store/useAppStore.ts, src/ui/**/*.tsx

