# Budget Inquiry System Workflow Feature Module Development

## Action

Follow the feature-module-development workflow:
1. Create or update domain model files (e.g., domain/systems.ts, domain/bigSystems.ts, domain/types.ts, domain/seed.ts)
2. Update or add UI components or tabs (e.g., src/ui/tabs/*.tsx, src/ui/MainApp.tsx)
3. Update store logic and state (src/store/useAppStore.ts)
4. Update calculation or utility files (src/ui/useCalc.ts, src/engine/checks.ts)
5. Update styles if needed (src/styles.css)
6. Update or add related tests (src/engine/checks.test.ts)
7. Update documentation if necessary (README.md)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/domain/*.ts, src/ui/tabs/*.tsx, src/ui/MainApp.tsx

